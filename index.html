<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Celebrate – Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css?v=1.03" />
  


</head>

<body data-theme="light">

<header class="masthead">
  <img id="brandLogo" class="brand-logo" src="images/logo_big 1.png" />

  <div class="masthead-controls">

    <!-- Row 2 -->
    <div class="search-wrapper">
      <input id="searchInput" placeholder="Search..." />
    </div>

    <button id="themeToggle" title="Toggle theme">
      🌙
    </button>

    <!-- Row 3 -->
    <div class="filters-row">
      <div class="filter-group">
        <label>Type</label>
        <select id="typeFilter">
		  <option value="all">All</option>
		  <option value="birthday">Birthdays</option>
		  <option value="anniversary">Anniversaries</option>
		</select>
      </div>

      <div class="filter-group">
        <label>Family</label>
        <select id="familyFilter"></select>
      </div>

      <div class="filter-group">
        <label>Timeframe</label>
        <select id="timeFilter">		
			<option value="all">All</option>
			<option value="priority">Priority</option>
			<option value="upcoming">Upcoming</option>
			<option value="past">Past</option>
		</select>
      </div>

		<div class="filter-group logout-group">
		  <label>&nbsp;</label>
		  <button id="logoutBtn" class="icon-btn" title="Logout">
			 <!-- SVG logout icon -->
			<svg viewBox="0 0 1024 1024" aria-hidden="true">
				<path d="M868 732h-70.3c-4.8 0-9.3 2.1-12.3 5.8-7 8.5-14.5 16.7-22.4 24.5a353.84 353.84 0 0 1-112.7 75.9A352.8 352.8 0 0 1 512.4 866c-47.9 0-94.3-9.4-137.9-27.8a353.84 353.84 0 0 1-112.7-75.9 353.28 353.28 0 0 1-76-112.5C167.3 606.2 158 559.9 158 512s9.4-94.2 27.8-137.8c17.8-42.1 43.4-80 76-112.5s70.5-58.1 112.7-75.9c43.6-18.4 90-27.8 137.9-27.8 47.9 0 94.3 9.3 137.9 27.8 42.2 17.8 80.1 43.4 112.7 75.9 7.9 7.9 15.3 16.1 22.4 24.5 3 3.7 7.6 5.8 12.3 5.8H868c6.3 0 10.2-7 6.7-12.3C798 160.5 663.8 81.6 511.3 82 271.7 82.6 79.6 277.1 82 516.4 84.4 751.9 276.2 942 512.4 942c152.1 0 285.7-78.8 362.3-197.7 3.4-5.3-.4-12.3-6.7-12.3zm88.9-226.3L815 393.7c-5.3-4.2-13-.4-13 6.3v76H488c-4.4 0-8 3.6-8 8v56c0 4.4 3.6 8 8 8h314v76c0 6.7 7.8 10.5 13 6.3l141.9-112a8 8 0 0 0 0-12.6z"/>
			  </svg>
		  </button>
		</div>

    </div>

  </div>
</header>

<main class="container">

  <!-- PRIORITY -->
  <section id="prioritySection">
    <div class="section-header">
      <div class="section-title">
        <h2>Priority celebrations 🎉</h2>
        <span id="priorityCount" class="count">0</span>
      </div>
    </div>
    <div id="priorityList" class="priority-grid"></div>
  </section>

  <!-- UPCOMING -->
  <section id="upcomingSection">
    <div class="section-header">
      <div class="section-title">
        <h2>Upcoming events 🗓️</h2>
        <span id="upcomingCount" class="count">0</span>
      </div>

      <button class="section-toggle" onclick="toggleSection('upcoming')">
        <span id="upcomingToggleText">Hide</span>
        <img
          id="upcomingToggleIcon"
          src="images/Up_arrow_Icon.png"
          class="toggle-icon"
          alt="toggle"
        />
      </button>
    </div>

    <div id="upcomingSection" class="section-content">
      <div id="upcomingList" class="list-container"></div>
    </div>
  </section>

  <!-- PAST -->
  <section id="pastSection">
    <div class="section-header">
      <div class="section-title">
        <h2>Past events 🗓️</h2>
        <span id="pastCount" class="count">0</span>
      </div>

      <button class="section-toggle" onclick="toggleSection('past')">
        <span id="pastToggleText">Hide</span>
        <img
          id="pastToggleIcon"
          src="images/Up_arrow_Icon.png"
          class="toggle-icon"
          alt="toggle"
        />
      </button>
    </div>

    <div id="pastSection" class="section-content">
      <div id="pastList" class="list-container"></div>
    </div>
  </section>
	
	<!-- MISSING Data -->

	<section id="missingDataSection" style="display:none;">
	  <h3>Missing Data</h3>

	  <div id="missingDataTable" class="missing-table"></div>
	</section>


</main>


<footer class="app-footer">
  <span>© 2026 – KKK Groups Pvt LTD</span>
  
	<button id="addToCalendarBtn">📅 Add to Calendar</button>

  <span class="version">Version 1.05</span>
   <!-- <button class="footer-link" onclick="openMissingModal()">Missing details</button> -->
</footer>


<div id="missingModal" class="modal-backdrop">
  <div class="modal">
    <h3>Missing Details</h3>

    <div class="modal-section">
      <strong>🎂 Missing Birthday Dates</strong>
      <ul id="missingBirthdays"></ul>
    </div>

    <div class="modal-section">
      <strong>💍 Missing Anniversary Dates</strong>
      <ul id="missingAnniversaries"></ul>
    </div>

    <button class="close-btn" onclick="closeMissingModal()">Close</button>
  </div>
</div>
<!-- for version -->
<script src="js/version.js"></script>

<script>
  const v = window.APP_VERSION;

  document.write(`
    <link rel="stylesheet" hrefjs?v=${    <script src="js/app.js?vt>
  `);
</script>

<!-- Data -->
<script src="data/events.js?v=1.03"></script>
<!-- App logic -->
<script src="js/app.js?v=1.03"></script>

</body>
</html>
